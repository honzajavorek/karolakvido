[build-system]
requires = ["uv-build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[project]
name = "karolakvido"
version = "0.1.0"
description = "Export kalendáře Karol a Kvído do iCalendar"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "click>=8.3.2",
  "ics>=0.8.0.dev0",
  "requests>=2.33.1",
  "tenacity>=9.1.4",
]

[project.scripts]
karolakvido = "karolakvido.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
